name: Build AL Application
author: The 365 People
inputs:
  path:
    description: Solution path - it can be workspace folder, project folder, project file or workspace file
    required: true
  compilerpath:
    description: full path to the al compiler alc.exe
    required: true
  analyzers:
    description: Comma separated list of analyzers
    required: false
  warnaserror:
    description: Warnings as errors
    required: false
    default: 'false'
  outpath:
    description: Output path where compiled apps should be saved
    required: true
  alpackagespath:
    description: AL Packages relative path
    required: false
    default: '.alpackages'
  ruleset:
    description: Ruleset file
    required: false
  apikey:
    description: TNP NuGet server api key
    required: true
  nugetsettingspath:
    description: Path to file with list of additional NuGet feeds
    required: false
  dependenciesselectionmode:
    description: NuGet server dependencies selection mode, avaliable options - First, Latest
    required: false
    default: 'First'
  dependenciesprereleasesuffix:
    description: Pre-release version suffix for dependencies downloaded from the NuGet server
    required: false
  downloaddependencies:
    description: Set to false to skip dependencies download from BC artifacts and NuGet server
    required: false
  configuration:
    description: project configuration to use (app.json.<configuration> file will be renamed to app.json)
    required: false
  bcapplicationversion:
    description: New value (override) for the application property in the app.json
    required: false
  bcruntimeversion:
    description: New value (override) for the runtime property in the app.json
    required: false
  bcversion:
    description: BC symbols version that should be used for compilation
    required: false
  bcversionselectionMode:
    description: BC version selection mode
    required: false
    default: 'Closest'
  bcartifactstype:
    description: BC Artifacts type - OnPrem or Sandbox
    required: false
    default: "onprem"
  bcartifactsstorageaccount:
    description: BC Artifacts storage account - bcartifacts for public versions or bcinsider for insider previews
    required: false
    default: "bcartifacts"
  bcartifactssaastoken:
    description: BC insider previews artifacts storage account access token
    required: false
  bccountry:
    description: BC country version
    required: false
    default: 'gb'
  directbcartifactssymbolsdownload:
    description: Download symbols from BC artifacts without dowloading whole zip file
    required: false
    default: 'false'
  versionmajor:
    description: Version major to be used during building extension
    required: false
  versionminor:
    description: Version minor to be used during building extension
    required: false
  versionbuild:
    description: Version build to be used during building extension
    required: false
  versionrevision:
    description: Version revision to be used during building extension
    required: false
  versionbuildoffset:
    description: Version build offset to be added to the versionbuild parameter
    required: false
  versionrevisionoffset:
    description: Version revision offset to be added to the versionrevision
    required: false
  changeversion:
    description: Change version in the app.json
    required: false
    default: 'true'
  commitversionchange:
    description: Commit version update to the repository
    required: false
    default: 'false'
  versionchangecommitmessage:
    description: version update commit message
    required: false
  usenavcompiler:
    description: Build process uses NAV compiler
    required: false
    default: 'false'
  compilerlog:
    description: AL compiler log file
    required: false
  parallel:
    description: Decide if compiler shpuld use parallel compilation
    required: false

runs:
  using: composite
  steps:
    - name: run
      shell: powershell
      run: ${{ github.action_path }}/build.ps1 -Path "${{ inputs.path }}" -CompilerPath "${{ inputs.compilerpath }}" -Analyzers "${{ inputs.analyzers }}" -WarnAsError "${{ inputs.warnaserror }}" -OutPath "${{ inputs.outpath }}" -ALPackagesPath "${{ inputs.alpackagespath }}" -Ruleset "${{ inputs.ruleset }}" -ApiKey "${{ inputs.apikey }}" -NuGetSettingsPath "${{ inputs.nugetsettingspath }}" -DependenciesSelectionMode "${{ inputs.dependenciesselectionmode }}" -DependenciesPreReleaseSuffix "${{ inputs.dependenciesprereleasesuffix }}" -BCConfiguration "${{ inputs.configuration }}" -BCApplicationVersion "${{ inputs.bcapplicationversion }}" -BCRuntimeVersion "${{ inputs.bcruntimeversion }}" -BCVersion "${{ inputs.bcversion }}" -BCVersionSelectionMode "${{ inputs.bcversionselectionmode }}" -BCArtifactsType "${{ inputs.bcartifactstype }}" -BCArtifactsStorageAccount "${{ inputs.bcartifactsstorageaccount }}" -BCCountry "${{ inputs.bccountry }}" -VersionMajor "${{ inputs.versionmajor }}" -VersionMinor "${{ inputs.versionminor }}" -VersionBuild "${{ inputs.versionbuild }}" -VersionRevision "${{ inputs.versionrevision }}" -VersionBuildOffset "${{ inputs.versionbuildoffset }}" -VersionRevisionOffset "${{ inputs.versionrevisionoffset }}" -DefaultRuleset "${{ github.action_path }}\..\settings\default.ruleset.json" -DownloadDependencies "${{ inputs.downloaddependencies }}" -ChangeVersion "${{ inputs.changeversion }}" -CommitVersionChange "${{ inputs.commitversionchange }}" -UseNavCompiler "${{ inputs.usenavcompiler }}" -VersionChangeCommitMessage "${{ inputs.versionchangecommitmessage }}" -CompilerLog "${{ inputs.compilerlog }}" -Parallel "${{ inputs.parallel }}" -DirectBCArtifactsSymbolsDownload "${{ inputs.directbcartifactssymbolsdownload }}"
